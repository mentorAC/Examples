global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: metrix
    metrics_path: /metrics
    static_configs:
      # Metrix running locally (dotnet run, "http" profile).
      - targets: ["host.docker.internal:5162"]
    metric_relabel_configs:
      # Metric names are per command (standard_delivery_command_total, ...);
      # copy the command part into a "command" label so dashboards can group by it.
      - source_labels: [__name__]
        regex: "(.+_command)_(total|in_progress|duration_seconds_(bucket|sum|count)|value_(bucket|sum|count))"
        target_label: command
        replacement: "$1"
