name: tracing-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: tracing-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      # Tempo's metrics generator writes span metrics and the service graph here.
      - --web.enable-remote-write-receiver
      # Keeps the trace_id exemplars the app attaches to histograms.
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # The app runs on the host, not in Docker; this makes host.docker.internal resolvable on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8
    container_name: tracing-loki
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      # HTTP API; the app pushes logs to the native OTLP endpoint /otlp/v1/logs.
      - "3100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.0
    container_name: tracing-tempo
    command:
      - -target=all
      - -config.file=/etc/tempo/tempo.yml
    depends_on:
      - prometheus
    ports:
      - "3200:3200" # HTTP API (Grafana queries it)
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP; the app pushes traces to /v1/traces
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    container_name: tracing-grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    ports:
      - "3000:3000"
    environment:
      # Local development only: open Grafana without a login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/logs-traces.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
